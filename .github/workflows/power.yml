name: Проверка света

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может запускать с задержкой)
  workflow_dispatch:         # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write            # чтобы сохранять state.json и events.jsonl в репозиторий

concurrency:
  group: power-check         # запуски идут строго по очереди
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить свет
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MI_USER: ${{ secrets.MI_USER }}
          MI_PASS: ${{ secrets.MI_PASS }}
          MI_PASS_TOKEN: ${{ secrets.MI_PASS_TOKEN }}
          MI_COUNTRY: ${{ secrets.MI_COUNTRY }}
        run: python power_bot.py --once

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "power-bot"
          git config user.email "power-bot@users.noreply.github.com"
          for f in state.json events.jsonl; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "Обновление состояния"
            git pull --rebase
            git push
          fi
